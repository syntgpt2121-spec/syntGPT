[build]
  command = "npm --prefix server run postinstall && npm --prefix server run build && node -e \"const fs=require('fs');const path=require('path');const src=path.join('server','dist');const dst=path.join('netlify','functions','server','dist');fs.rmSync(path.join('netlify','functions','server'),{recursive:true,force:true});fs.mkdirSync(path.dirname(dst),{recursive:true});fs.cpSync(src,dst,{recursive:true});\" && npm --prefix client run build"
  publish = "client/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/functions/server/dist/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
